server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/leaderboard;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

pystarter:
  leaderboard:
    sign-secret: "PyStarter-2026-Secret"
