server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/leaderboard;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

pystarter:
  leaderboard:
    # 客户端与服务端约定的防篡改校验盐（演示用途；生产环境放环境变量）
    sign-secret: "PyStarter-2026-Secret"
