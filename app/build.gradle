plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.pystarter.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pystarter.app'
        minSdk 24                 // Android 7.0 及以上
        targetSdk 35
        versionCode 3
        versionName '1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Chaquopy 需要指定打包哪些 CPU 架构：真机多为 arm64，电脑上的模拟器是 x86_64
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // 正式签名：密钥和密码不进仓库，从 keystore.properties（已加入 .gitignore）或环境变量读取。
    // 两者都没有时（比如别人克隆下来自己编译），正式版临时用调试密钥签名，保证能打包和测试。
    def keyProps = new Properties()
    def keyFile = rootProject.file('keystore.properties')
    if (keyFile.exists()) {
        keyFile.withInputStream { keyProps.load(it) }
    }
    def keyValue = { String name -> keyProps.getProperty(name) ?: System.getenv('PYSTARTER_' + name.toUpperCase()) }
    def hasReleaseKey = keyValue('storeFile') != null

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(keyValue('storeFile'))
                storePassword keyValue('storePassword')
                keyAlias keyValue('keyAlias')
                keyPassword keyValue('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // R8：删除没用到的代码、缩短类名，安装包更小
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    // 按 CPU 架构拆分安装包：手机只下载自己需要的那一份（arm64 真机 / x86_64 模拟器），
    // 同时保留一个通用包，方便直接发给别人安装
    splits {
        abi {
            // 只在打正式版时拆分；调试版保持一个 app-debug.apk，测试和 CI 不受影响
            enable gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // 单元测试在电脑上跑，安卓 API 只是空壳：让它们返回默认值，而不是直接报错
        unitTests.returnDefaultValues = true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true          // 自动生成 ActivityMainBinding 这类类，不用写 findViewById
        compose true              // 单步慢放等新页面用 Jetpack Compose 写
    }
}

chaquopy {
    defaultConfig {
        version '3.12'            // App 里内嵌的 Python 版本
        pyc {
            src false             // 不在电脑上预编译 .py，省去对本机 Python 版本的要求
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime:2.9.1'

    // Kotlin + Jetpack Compose + ViewModel
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'

    // 测试：JUnit 单元测试（电脑上跑）+ Espresso UI 测试（模拟器上跑）
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    def room = '2.6.1'
    implementation "androidx.room:room-runtime:$room"
    annotationProcessor "androidx.room:room-compiler:$room"
}
