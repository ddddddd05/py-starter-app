plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.pystarter.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pystarter.app'
        minSdk 24                 // Android 7.0 及以上
        targetSdk 35
        versionCode 1
        versionName '1.0'

        // Chaquopy 需要指定打包哪些 CPU 架构：真机多为 arm64，电脑上的模拟器是 x86_64
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true          // 自动生成 ActivityMainBinding 这类类，不用写 findViewById
    }
}

chaquopy {
    defaultConfig {
        version '3.12'            // App 里内嵌的 Python 版本
        pyc {
            src false             // 不在电脑上预编译 .py，省去对本机 Python 版本的要求
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime:2.9.1'

    def room = '2.6.1'
    implementation "androidx.room:room-runtime:$room"
    annotationProcessor "androidx.room:room-compiler:$room"
}
