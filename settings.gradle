// 依赖下载：在国内优先走阿里云镜像（快），找不到再回到官方仓库。
// 在 GitHub Actions 等海外 CI 上（环境变量 CI=true）直接用官方仓库，访问国内镜像反而很慢。
pluginManagement {
    repositories {
        if (System.getenv('CI') == null) {
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
// pluginManagement 必须是文件里的第一条语句，所以变量只能定义在它后面
def useChinaMirror = System.getenv('CI') == null

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (useChinaMirror) {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
    }
}
rootProject.name = 'PyStarter'
include ':app'
