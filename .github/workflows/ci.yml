# 每次推送 / 提 PR 自动检查：
# 1. Python 核心逻辑测试（判题、闯关层、单步跟踪器）
# 2. 安卓：JUnit 单元测试（闯关规则）+ 打包调试版 APK（作为构建产物可下载）
# 3. 安卓：在模拟器上跑 Espresso UI 测试（主流程）
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # 和 App 里内嵌的 Python 版本一致
      - run: pip install pytest
      - run: python -m pytest -q

  android:
    name: 单元测试 + 打包 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 单元测试
        run: ./gradlew testDebugUnitTest --console=plain
      - name: 打包调试版 APK
        run: ./gradlew assembleDebug --console=plain
      - name: 打包正式版（检查 R8 压缩和按架构拆分；没有密钥时用调试密钥签名）
        run: ./gradlew assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: PyStarter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PyStarter-release-apks
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

  ui-test:
    name: UI 测试（模拟器）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 开启 KVM（模拟器硬件加速）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 在模拟器上跑 Espresso 测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/connected/
